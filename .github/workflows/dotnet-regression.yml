name: BOOT - Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Full diagnostic regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run xUnit regression tests
        run: dotnet test tests/RiskPilot.Diagnostics.Nt8.Tests/RiskPilot.Diagnostics.Nt8.Tests.csproj --configuration Release -p:UseStubs=true --logger "trx;LogFileName=boot-regression.trx"

      - name: Re-run diagnostic safety invariants
        run: python3 verification/addon-smoke/test_diagnostic_safety.py

      - name: Upload regression results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: boot-regression-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: ignore
          retention-days: 3
