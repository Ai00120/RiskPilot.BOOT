name: BOOT - Real NinjaTrader Windows Build

# Manual-only by design. This job requires a privately managed Windows runner
# with NinjaTrader 8.1.8.4 and its licensed host assemblies installed.
# A hosted windows-latest runner does not satisfy that requirement.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-real-nt8-build
  cancel-in-progress: false

jobs:
  real-nt8-build:
    name: Compile against installed NinjaTrader assemblies
    runs-on: [self-hosted, Windows, X64, nt8]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify NinjaTrader host installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ntRoot = 'C:\Program Files\NinjaTrader 8\bin'
          $required = @('NinjaTrader.Core.dll', 'NinjaTrader.Gui.dll')
          foreach ($file in $required) {
            $path = Join-Path $ntRoot $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required NinjaTrader assembly missing: $path"
            }
            Write-Host "Found: $path"
          }
          $versionFile = Join-Path $ntRoot 'NinjaTrader.Core.dll'
          $version = (Get-Item -LiteralPath $versionFile).VersionInfo.FileVersion
          Write-Host "NinjaTrader.Core file version: $version"
          if (-not $version) { throw 'Could not determine NinjaTrader assembly version.' }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile against real NT8 assemblies (no stubs)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build src\RiskPilot.Diagnostics.Nt8\RiskPilot.Diagnostics.Nt8.csproj --configuration Release -p:UseStubs=false
          if ($LASTEXITCODE -ne 0) { throw "Real NinjaTrader build failed with exit code $LASTEXITCODE" }

      - name: Upload real-host build output
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: boot-real-nt8-build
          path: src/RiskPilot.Diagnostics.Nt8/bin/Release/net48/
          if-no-files-found: warn
          retention-days: 3
